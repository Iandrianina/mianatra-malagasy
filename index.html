<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#3c3c3c;--mut:#777;--line:#e5e5e5;--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--b:#1cb0f6;--card:#f7f7f7;--gl:#d7ffb8;--rl:#ffdfe0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#eee;--mut:#9aa;--line:#37464f;--card:#1f2c33;--gl:#1f3a12;--rl:#4a2226}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#eee;--mut:#9aa;--line:#37464f;--card:#1f2c33;--gl:#1f3a12;--rl:#4a2226}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700}
#app{max-width:600px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:4px 12px}
.mod{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;margin-bottom:14px;color:inherit;font:inherit;cursor:pointer}
.mod:active{transform:translateY(2px)}
.ic{width:54px;height:54px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 5px 0 var(--gd)}
.mod small{display:block;color:var(--mut);font-weight:600;margin-top:2px}
.btn{width:100%;padding:14px;border:0;border-bottom:4px solid var(--gd);border-radius:14px;background:var(--g);color:#fff;font:inherit;font-size:16px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.btn:disabled{background:var(--line);border-color:var(--mut);color:var(--mut);cursor:default}
.btn.sec{background:transparent;color:var(--b);border:2px solid var(--line);border-bottom-width:4px}
.bar{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 12px}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.x{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
.q{flex:1;padding:14px 0}
.q h2{font-size:22px;margin:6px 0 18px}
.big{font-size:24px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;background:var(--bg);color:inherit;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font:inherit;font-size:17px;cursor:pointer}
.opt.sel{border-color:var(--b);background:rgba(28,176,246,.12)}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.bad{border-color:var(--r);background:var(--rl)}
.area{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tok{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-size:17px;cursor:pointer}
.fb{margin:0 -16px;padding:14px 16px 16px;border-top:2px solid var(--line)}
.fb.ok{background:var(--gl)}.fb.bad{background:var(--rl)}
.fb p{margin:0 0 10px;font-size:18px}
.fb.ok p{color:var(--gd)}.fb.bad p{color:var(--r)}
.tip{background:var(--card);border-left:5px solid var(--b);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.end{text-align:center;padding:40px 0;flex:1}
.end .em{font-size:64px}
.st{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.st:disabled{opacity:.45;cursor:default}
.st .n{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.st.lk .n{background:var(--mut)}
.st small{display:block;color:var(--mut);font-weight:600}
.new{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.new b{color:var(--gd)}
.inp{width:100%;padding:14px;margin-bottom:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-size:17px}
.err{color:var(--r);margin:0 0 10px}
</style>

var U=null,SB=null,S=load(),L=null,app=document.getElementById("app");
function load(){var d;try{d=JSON.parse(localStorage.getItem("mg2"))}catch(e){}d=d||{};d.xp=d.xp||0;d.done=d.done||{};return d}
function save(){if(U)return;try{localStorage.setItem("mg2",JSON.stringify(S))}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cnt(i){var n=0;for(var s=0;s<M[i].steps.length;s++)if(S.done[i+"-"+s]!==undefined)n++;return n}
var AC;function snd(t){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();var q=[[[660,0],[880,.12]],[[220,0],[165,.15]],[[523,0],[659,.1],[784,.2],[1047,.3]],[[300,0],[200,.15],[150,.3]]][t];q.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain(),st=AC.currentTime+n[1];o.type=t%2?"sawtooth":"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.2,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.22);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+.25)})}catch(e){}}
function sb(){return '<button class="x" id="sn" title="Son">'+(S.mute?"🔇":"🔊")+'</button>'}
app.addEventListener("click",function(e){var t=e.target.closest("#sn");if(t){S.mute=!S.mute;save();t.textContent=S.mute?"🔇":"🔊"}});
function home(){L=null;var h='<div class="top"><span class="pill">⭐ '+S.xp+' XP</span>'+acct()+sb()+'</div><h1>Mianatra Malagasy 🇲🇬</h1><p class="sub">6 modules, des étapes courtes de 5 à 10 mots.</p>';

function mpage(i){L=null;var m=M[i],h='<div class="top"><button class="x" id="bk">←</button><span class="pill">⭐ '+S.xp+' XP</span>'+acct()+sb()+'</div><h1>Module '+(i+1)+' : '+m.t+'</h1><p class="sub">'+cnt(i)+' / '+m.steps.length+' étapes</p>';
m.steps.forEach(function(st,s){var d=S.done[i+"-"+s],lk=s>0&&S.done[i+"-"+(s-1)]===undefined;h+='<button class="st'+(lk?' lk':'')+'"'+(lk?' disabled':'')+' data-s="'+s+'"><span class="n">'+(d!==undefined?'✓':lk?'🔒':s+1)+'</span><span>'+st.t+'<small>'+(d!==undefined?'Score : '+d+'%':lk?'Verrouillée':'À faire')+'</small></span></button>'});

function mk(m,it,dir){var q=dir?it[0]:it[1],a=dir?it[1]:it[0],n=it[1].split(" ").length,all=m.items.filter(function(x){return x!==it}).map(function(x){return dir?x[1]:x[0]}),same=all.filter(function(x){return x.split(" ").length==a.split(" ").length});

function mkq(m,it,t){return t=="b"?{k:"b",fr:it[0],mg:it[1],bank:sh(it[1].split(" "))}:mk(m,it,t=="f")}
function start(i,s){var m=M[i],st=m.steps[s],ix=sh(st.ix),tp=ix.map(function(k){return sh(m.items[k][1].split(" ").length>1?["f","m","b"]:["f","m"])}),tg=Math.min(12,ix.length*2),c=[];

app.innerHTML=h+'</div><button class="btn" id="go">Commencer</button>';document.getElementById("qx").onclick=function(){mpage(L.i)};document.getElementById("go").onclick=function(){L.intro=false;draw()};return}

else{h+='<h2>Traduis en malagasy</h2><div class="big">'+q.fr+'</div><div class="area">';L.pick.forEach(function(t,j){h+='<button class="tok" data-r="'+j+'">'+q.bank[t]+'</button>'});h+='</div><div class="area" style="border:0">';q.bank.forEach(function(w,j){if(L.pick.indexOf(j)<0)h+='<button class="tok" data-a="'+j+'">'+w+'</button>'});h+='</div>'}
